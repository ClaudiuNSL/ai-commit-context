<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Commit Context - Conversation Viewer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      line-height: 1.6;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      border-bottom: 1px solid #30363d;
      padding-bottom: 20px;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #58a6ff;
      text-decoration: none;
      font-size: 1.2em;
      font-weight: 600;
    }

    .logo:hover {
      color: #79c0ff;
    }

    .session-header {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .session-header h1 {
      font-size: 1.5em;
      margin-bottom: 15px;
      color: #f0f6fc;
    }

    .session-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 0.9em;
      color: #8b949e;
    }

    .session-meta span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .files-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .files-section h3 {
      font-size: 0.9em;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .file-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .file-tag {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.8em;
      font-family: monospace;
      color: #7ee787;
    }

    .conversation {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      border-radius: 8px;
      padding: 15px;
      border: 1px solid #30363d;
    }

    .message.user {
      background: #1c2128;
      border-left: 3px solid #58a6ff;
    }

    .message.assistant {
      background: #161b22;
      border-left: 3px solid #7ee787;
    }

    .message-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.85em;
    }

    .message-role {
      font-weight: 600;
      text-transform: capitalize;
    }

    .message.user .message-role {
      color: #58a6ff;
    }

    .message.assistant .message-role {
      color: #7ee787;
    }

    .message-time {
      color: #8b949e;
    }

    .message-content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-content code {
      background: #21262d;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.9em;
    }

    .message-content pre {
      background: #21262d;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      margin: 10px 0;
    }

    .message-content pre code {
      background: none;
      padding: 0;
    }

    .tool-use {
      background: #1c2128;
      border: 1px solid #30363d;
      border-radius: 6px;
      margin: 10px 0;
      overflow: hidden;
    }

    .tool-header {
      background: #21262d;
      padding: 8px 12px;
      font-size: 0.85em;
      color: #d29922;
      font-family: monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tool-content {
      padding: 12px;
      font-family: monospace;
      font-size: 0.85em;
      max-height: 300px;
      overflow: auto;
    }

    .loading {
      text-align: center;
      padding: 50px;
      color: #8b949e;
    }

    .error {
      text-align: center;
      padding: 50px;
      color: #f85149;
    }

    .commits-section {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .commits-section h3 {
      font-size: 0.9em;
      color: #8b949e;
      margin-bottom: 10px;
    }

    .commit-link {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #21262d;
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .commit-sha {
      font-family: monospace;
      color: #58a6ff;
      font-size: 0.85em;
    }

    .commit-message {
      color: #c9d1d9;
      font-size: 0.9em;
    }

    @media (max-width: 600px) {
      .session-meta {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a href="/" class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 6v6l4 2"></path>
        </svg>
        AI Commit Context
      </a>
    </header>

    <main id="app">
      <div class="loading">Loading conversation...</div>
    </main>
  </div>

  <script>
    const app = document.getElementById('app');

    // Get session code from URL
    const pathParts = window.location.pathname.split('/');
    const sessionCode = pathParts[pathParts.length - 1];

    if (!sessionCode || sessionCode === 'c') {
      showHome();
    } else {
      loadSession(sessionCode);
    }

    async function showHome() {
      try {
        const response = await fetch('/api/sessions');
        const data = await response.json();

        if (data.sessions.length === 0) {
          app.innerHTML = `
            <div class="session-header">
              <h1>No sessions uploaded yet</h1>
              <p style="color: #8b949e; margin-top: 10px;">
                Use <code>acc upload</code> to upload your first session.
              </p>
            </div>
          `;
          return;
        }

        app.innerHTML = `
          <div class="session-header">
            <h1>Recent Sessions</h1>
          </div>
          <div class="conversation">
            ${data.sessions.map(s => `
              <a href="/c/${s.shortCode}" class="message user" style="text-decoration: none;">
                <div class="message-header">
                  <span class="message-role">${s.projectName}</span>
                  <span class="message-time">${formatDate(s.uploadedAt)}</span>
                </div>
                <div class="message-content">
                  ${s.messageCount} messages${s.commitsCount > 0 ? ` • ${s.commitsCount} commits linked` : ''}
                </div>
              </a>
            `).join('')}
          </div>
        `;
      } catch (error) {
        app.innerHTML = `<div class="error">Failed to load sessions</div>`;
      }
    }

    async function loadSession(code) {
      try {
        const response = await fetch(`/api/sessions/${code}`);

        if (!response.ok) {
          throw new Error('Session not found');
        }

        const session = await response.json();
        renderSession(session);
      } catch (error) {
        app.innerHTML = `
          <div class="error">
            <h2>Session not found</h2>
            <p style="margin-top: 10px; color: #8b949e;">
              The conversation you're looking for doesn't exist or has been deleted.
            </p>
            <a href="/" style="color: #58a6ff; margin-top: 20px; display: inline-block;">
              ← Back to home
            </a>
          </div>
        `;
      }
    }

    function renderSession(session) {
      const filesHtml = session.filesModified.length > 0 ? `
        <div class="files-section">
          <h3>Files Modified (${session.filesModified.length})</h3>
          <div class="file-list">
            ${session.filesModified.map(f => `
              <span class="file-tag">${getFileName(f)}</span>
            `).join('')}
          </div>
        </div>
      ` : '';

      const commitsHtml = session.commits.length > 0 ? `
        <div class="commits-section">
          <h3>Linked Commits (${session.commits.length})</h3>
          ${session.commits.map(c => `
            <div class="commit-link">
              <span class="commit-sha">${c.sha.substring(0, 7)}</span>
              <span class="commit-message">${c.message || 'No message'}</span>
            </div>
          `).join('')}
        </div>
      ` : '';

      const messagesHtml = session.messages
        .filter(m => m.type === 'user' || m.type === 'assistant')
        .map(m => renderMessage(m))
        .join('');

      app.innerHTML = `
        <div class="session-header">
          <h1>${session.projectName}</h1>
          <div class="session-meta">
            <span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              ${session.messageCount} messages
            </span>
            <span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              ${formatDate(session.startedAt)}
            </span>
            <span>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
              ${session.filesModified.length} files
            </span>
          </div>
        </div>

        ${filesHtml}
        ${commitsHtml}

        <div class="conversation">
          ${messagesHtml}
        </div>
      `;
    }

    function renderMessage(msg) {
      const content = formatContent(msg.message.content);
      const time = msg.timestamp ? formatTime(msg.timestamp) : '';

      return `
        <div class="message ${msg.type}">
          <div class="message-header">
            <span class="message-role">${msg.type === 'user' ? 'You' : 'Claude'}</span>
            ${time ? `<span class="message-time">${time}</span>` : ''}
          </div>
          <div class="message-content">${content}</div>
        </div>
      `;
    }

    function formatContent(content) {
      if (typeof content === 'string') {
        return escapeHtml(content);
      }

      if (Array.isArray(content)) {
        return content.map(block => {
          if (block.type === 'text') {
            return escapeHtml(block.text || '');
          }
          if (block.type === 'tool_use') {
            return `
              <div class="tool-use">
                <div class="tool-header">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
                  </svg>
                  ${block.name || 'Tool'}
                </div>
                <div class="tool-content">${formatToolInput(block.input)}</div>
              </div>
            `;
          }
          return '';
        }).join('');
      }

      return '';
    }

    function formatToolInput(input) {
      if (!input) return '';
      try {
        if (typeof input === 'string') return escapeHtml(input);
        return escapeHtml(JSON.stringify(input, null, 2));
      } catch {
        return '';
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getFileName(path) {
      return path.split(/[/\\]/).pop() || path;
    }

    function formatDate(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit',
      });
    }

    function formatTime(dateStr) {
      const date = new Date(dateStr);
      return date.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
      });
    }
  </script>
</body>
</html>
