name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webapp/package-lock.json
            github-action/package-lock.json

      - name: Install CLI deps
        run: npm install

      - name: Build CLI
        run: npm run build

      - name: Install webapp deps
        run: npm install
        working-directory: webapp

      - name: Lint webapp
        run: npm run lint
        working-directory: webapp

      - name: Build webapp
        run: npm run build
        working-directory: webapp

      - name: Install action deps
        run: npm install
        working-directory: github-action

      - name: Build GitHub Action
        run: npm run build
        working-directory: github-action
